<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Probar la API de Cine Match</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px auto; max-width: 760px; padding: 0 16px; }
    fieldset { border: 1px solid #cbd5e1; border-radius: 10px; margin-bottom: 16px; }
    input { margin: 4px 6px 4px 0; padding: 6px; }
    button { padding: 6px 12px; }
    pre { background: #0f172a; border-radius: 8px; color: #e2e8f0; min-height: 80px; overflow: auto; padding: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Probar la API</h1>
  <p>Página solo para probar cada paso. Se borra cuando la página principal ya esté conectada.</p>

  <fieldset>
    <legend>1. Leer datos (GET)</legend>
    <button onclick="pedir('api/peliculas.php')">Películas</button>
    <button onclick="pedir('api/proximos.php')">Próximos estrenos</button>
    <button onclick="pedir('api/combos.php')">Combos</button>
    <button onclick="pedir('api/funciones.php?pelicula_id=1')">Funciones de la película 1</button>
    <button onclick="pedir('api/asientos.php?funcion_id=1')">Asientos ocupados (función 1)</button>
  </fieldset>

  <fieldset>
    <legend>2. Registro</legend>
    <form id="form-registro">
      <input name="nombre" placeholder="Usuario" required>
      <input name="email" type="email" placeholder="Email" required>
      <input name="password" type="password" placeholder="Contraseña (8+)" required>
      <button>Registrar</button>
    </form>
  </fieldset>

  <fieldset>
    <legend>3. Login y sesión</legend>
    <form id="form-login">
      <input name="usuario" placeholder="Usuario o email" required>
      <input name="password" type="password" placeholder="Contraseña" required>
      <button>Iniciar sesión</button>
    </form>
    <button onclick="pedir('api/sesion.php')">¿Quién está conectado?</button>
    <button onclick="pedir('api/logout.php', 'POST')">Cerrar sesión</button>
  </fieldset>

  <h3>Respuesta</h3>
  <pre id="salida">Tocá un botón…</pre>

  <script>
    const salida = document.getElementById("salida");

    async function pedir(url, metodo = "GET", cuerpo = null) {
      try {
        const respuesta = await fetch(url, { method: metodo, body: cuerpo });
        const texto = await respuesta.text();
        let mostrado = texto;
        try { mostrado = JSON.stringify(JSON.parse(texto), null, 2); } catch (e) {}
        salida.textContent = "Código HTTP: " + respuesta.status + "\n\n" + mostrado;
      } catch (error) {
        salida.textContent = "No se pudo conectar. ¿Abriste la página desde http://localhost/ ?";
      }
    }

    document.getElementById("form-registro").addEventListener("submit", (e) => {
      e.preventDefault();
      pedir("api/registro.php", "POST", new FormData(e.target));
    });
    document.getElementById("form-login").addEventListener("submit", (e) => {
      e.preventDefault();
      pedir("api/login.php", "POST", new FormData(e.target));
    });
  </script>
</body>
</html>
